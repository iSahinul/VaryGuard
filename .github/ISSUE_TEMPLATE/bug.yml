name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "For example: Python 3.12 on Ubuntu, or WordPress 6.x / PHP 8.2"
    validations:
      required: true
